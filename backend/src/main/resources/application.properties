server.port=${PORT:8080}

# --- Database ---------------------------------------------------------------
# Local development: embedded H2 file database in ./data (no setup needed).
# Production: set the DATABASE_URL environment variable to a PostgreSQL URL
# (postgres://user:password@host:5432/dbname). EReviveApplication converts it
# and switches to schema-postgres.sql automatically.
spring.datasource.url=jdbc:h2:file:./data/erevive;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.datasource.hikari.maximum-pool-size=5

# --- Uploads ----------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- CORS -------------------------------------------------------------------
# Comma-separated list of frontend origins allowed to call the API.
# In production set ALLOWED_ORIGINS, e.g. https://jananis-27.github.io
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
